<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识卡片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@500;700&family=Instrument+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ── 全局重置 ── */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  background: #F2F2F2;
  font-family: "Instrument Sans", "Noto Sans SC", "PingFang SC", sans-serif;
}
body { position: relative; overflow: hidden; }

/* ── 卡片容器 ── */
#card-page {
  width: 900px; height: 1200px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform-origin: center center;
}

/* ── 加载态空卡片 ── */
.empty-card {
  height: 100%;
  display: grid;
  place-items: center;
  color: rgba(255,255,255,0.38);
  font-size: 28px;
}
</style>
</head>
<body>
<main id="card-page">
  <article class="knowledge-card">
    <div class="empty-card">正在加载卡片...</div>
  </article>
</main>
<script src="/canvas/js/markdown-parser.js"></script>
<script src="/canvas/js/api-loader.js"></script>
<script src="/canvas/js/html-card-renderer.js"></script>
<script src="/canvas/js/source-editor.js"></script>
<script src="/canvas/js/bg-loader.js"></script>
<script>
function getRouteCardInfo() {
  const match = window.location.pathname.match(/\/canvas\/card\/(.+)\/(\d+)$/);
  if (!match) return { companyName: '', cardIndex: 1 };
  return {
    companyName: decodeURIComponent(match[1]),
    cardIndex: Number(match[2]),
  };
}

window.renderSourcePreview = function renderSourcePreview(source) {
  renderSourceIntoDocument(document, source);
  fitCardPage();
};

window.renderCardPage = function renderCardPage({ companyName, cardIndex, cardData }) {
  const sourceMap = SourceEditor ? SourceEditor.loadMap(companyName) : {};
  const defaultSource = renderCardSource({ companyName, cardIndex, cardData });
  const saved = sourceMap[cardIndex];
  const signature = SourceEditor ? SourceEditor.signature(defaultSource) : '';
  const source = saved && typeof saved === 'object' && saved.signature === signature
    ? saved.source || defaultSource
    : defaultSource;
  window.renderSourcePreview(source);
};

function fitCardPage() {
  const root = document.getElementById('card-page');
  const viewport = document.documentElement.getBoundingClientRect();
  const scale = Math.min(viewport.width / 900, viewport.height / 1200, 1);
  root.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener('resize', fitCardPage);

document.addEventListener('DOMContentLoaded', async () => {
  BgLoader.init();
  const params = new URLSearchParams(window.location.search);
  if (params.get('parent-driven') === '1') {
    fitCardPage();
    return;
  }
  const { companyName, cardIndex } = getRouteCardInfo();
  if (!companyName) return;
  try {
    const cardData = await loadSingleCardFromAPI(companyName, cardIndex);
    window.renderCardPage({
      companyName,
      cardIndex,
      cardData,
    });
  } catch (error) {
    document.getElementById('card-page').innerHTML = renderEmptyCard(`加载失败：${error.message}`);
  }
});
</script>
</body>
</html>
