<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识卡片</title>
<style>
/* ── 全局重置 ── */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  background: #F2F3F5;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
body { position: relative; overflow: hidden; }

/* ── 卡片容器 ── */
#card-page {
  width: 900px; height: 1200px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform-origin: center center;
}
.knowledge-card {
  width: 900px; height: 1200px;
  padding: 56px 72px;
  background: #FFFFFF;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
}

/* ── 页码标签 ── */
.page-label {
  margin: 0 0 8px;
  font-size: 18px;
  color: #C0C8D4;
  font-weight: 400;
  letter-spacing: 0.02em;
}

/* ── 导航（面包屑）── */
.card-nav {
  display: flex;
  align-items: center;
  gap: 0;
  font-size: 17px;
  color: #9CA3AF;
  margin-bottom: 40px;
  flex-wrap: nowrap;
  white-space: nowrap;
}
.card-nav strong {
  color: #111827;
  font-weight: 700;
}
.nav-sep {
  margin: 0 6px;
  color: #D1D5DB;
}

/* ── 内容区 ── */
.card-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* ── 字段行 ── */
.field-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field-label {
  font-size: 18px;
  color: #9CA3AF;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.field-value {
  font-size: 26px;
  line-height: 1.5;
  color: #374151;
}
.field-value p { margin: 0; }
.field-value ul {
  margin: 0;
  padding-left: 1.2em;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.field-value strong { color: #111827; font-weight: 700; }

/* ── 章节标题 ── */
.card-section-title {
  margin: 0 0 4px;
  font-size: 36px;
  font-weight: 800;
  color: #111827;
  line-height: 1.1;
}

/* ── 时间线（page 3）── */
.timeline-list {
  margin: 0; padding: 0; list-style: none;
  display: flex; flex-direction: column; gap: 18px;
}
.timeline-list li {
  display: flex; flex-wrap: wrap; gap: 8px;
  font-size: 24px; line-height: 1.4;
}
.tl-date {
  color: #29B8D4; font-weight: 700; white-space: nowrap;
}
.tl-event { color: #111827; font-weight: 600; }
.tl-impact { color: #6B7280; font-style: italic; }

/* ── 竞品列表（page 7）── */
.competitor-list {
  margin: 0; padding: 0; list-style: none;
  display: flex; flex-direction: column; gap: 14px;
}
.competitor-list li { font-size: 24px; line-height: 1.4; color: #374151; }

/* ── Page 1 专属 ── */
.p1-layout {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 20px;
}
.p1-tagline {
  margin: 0;
  font-size: 20px;
  color: #9CA3AF;
}
.p1-title {
  margin: 0;
  font-size: 80px;
  font-weight: 900;
  color: #111827;
  line-height: 1.05;
  letter-spacing: -0.02em;
}
.p1-logo-placeholder {
  width: 120px; height: 120px;
  border-radius: 24px;
  background: #F3F4F6;
  border: 1px solid #E5E7EB;
}
.p1-type {
  margin: 0;
  font-size: 22px;
  color: #6B7280;
}

/* ── Page 8 专属 ── */
.p8-follow {
  margin-top: auto;
  font-size: 24px;
  color: #9CA3AF;
  line-height: 1.6;
}
.p8-cta {
  margin: 8px 0 0;
  font-size: 28px;
  font-weight: 700;
  color: #29B8D4;
}

/* ── 空卡片 ── */
.empty-card {
  height: 100%;
  display: grid;
  place-items: center;
  color: #9CA3AF;
  font-size: 28px;
}
</style>
</head>
<body>
<main id="card-page">
  <article class="knowledge-card">
    <div class="empty-card">正在加载卡片...</div>
  </article>
</main>
<script src="/canvas/js/markdown-parser.js"></script>
<script src="/canvas/js/api-loader.js"></script>
<script src="/canvas/js/html-card-renderer.js"></script>
<script src="/canvas/js/source-editor.js"></script>
<script src="/canvas/js/bg-loader.js"></script>
<script>
function getRouteCardInfo() {
  const match = window.location.pathname.match(/\/canvas\/card\/(.+)\/(\d+)$/);
  if (!match) return { companyName: '', cardIndex: 1 };
  return {
    companyName: decodeURIComponent(match[1]),
    cardIndex: Number(match[2]),
  };
}

window.renderSourcePreview = function renderSourcePreview(source) {
  renderSourceIntoDocument(document, source);
  fitCardPage();
};

window.renderCardPage = function renderCardPage({ companyName, cardIndex, cardData }) {
  const sourceMap = SourceEditor ? SourceEditor.loadMap(companyName) : {};
  const defaultSource = renderCardSource({ companyName, cardIndex, cardData });
  const saved = sourceMap[cardIndex];
  const signature = SourceEditor ? SourceEditor.signature(defaultSource) : '';
  const source = saved && typeof saved === 'object' && saved.signature === signature
    ? saved.source || defaultSource
    : defaultSource;
  window.renderSourcePreview(source);
};

function fitCardPage() {
  const root = document.getElementById('card-page');
  const viewport = document.documentElement.getBoundingClientRect();
  const scale = Math.min(viewport.width / 900, viewport.height / 1200, 1);
  root.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener('resize', fitCardPage);

document.addEventListener('DOMContentLoaded', async () => {
  BgLoader.init();
  const { companyName, cardIndex } = getRouteCardInfo();
  if (!companyName) return;
  try {
    const cardData = await loadSingleCardFromAPI(companyName, cardIndex);
    window.renderCardPage({
      companyName,
      cardIndex,
      cardData,
    });
  } catch (error) {
    document.getElementById('card-page').innerHTML = renderEmptyCard(`加载失败：${error.message}`);
  }
});
</script>
</body>
</html>
