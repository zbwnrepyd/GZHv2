<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片参数编辑器</title>
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.1/dist/fabric.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  font-size: 13px;
  color: #1a1a2e;
  background: #f0f2f5;
  overflow: hidden;
}

/* ── 顶栏 ── */
#top-bar {
  height: 44px;
  background: #1a1a2e;
  color: #fff;
  display: flex; align-items: center;
  padding: 0 16px; gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}
#top-bar .title { font-weight: 600; font-size: 14px; }
#top-bar .sep { color: rgba(255,255,255,0.25); }
#top-bar .company { color: #29B8D4; font-weight: 500; }
#top-bar .spacer { flex: 1; }
.view-mode-btn {
  padding: 4px 12px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
  background: transparent; color: rgba(255,255,255,0.7); cursor: pointer;
  font-size: 12px;
}
.view-mode-btn.active { background: #29B8D4; border-color: #29B8D4; color: #fff; }
#preview-card-select {
  padding: 4px 8px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
  background: transparent; color: #fff; font-size: 12px; width: 48px;
}
#preview-card-select option { color: #1a1a2e; }
.preview-label { color: rgba(255,255,255,0.5); font-size: 11px; }

/* ── 主体 ── */
#main-area {
  display: flex; height: calc(100vh - 44px - 300px);
  min-height: 280px;
}
#fabric-panel {
  flex: 3; background: #e8ecf1;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
#fabric-panel canvas { display: block; }
#preview-panel {
  flex: 2; background: #1e1e2e;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
#preview-panel iframe {
  border: none; width: 900px; height: 1200px;
  transform-origin: center center;
}
#preview-panel .no-preview {
  color: rgba(255,255,255,0.3); font-size: 14px; text-align: center;
}

/* ── 控制面板 ── */
#control-panel {
  height: 300px; background: #fff; border-top: 1px solid #e2e8f0;
  overflow-y: auto; padding: 12px 16px;
  flex-shrink: 0;
}
.panel-section {
  margin-bottom: 8px; border: 1px solid #e2e8f0; border-radius: 6px;
  overflow: hidden;
}
.panel-section-header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: #f8fafc; cursor: pointer;
  font-weight: 600; font-size: 12px; color: #475569;
  user-select: none;
}
.panel-section-header .toggle-icon { font-size: 10px; width: 12px; }
.panel-section-body { padding: 8px 12px 12px; }

.param-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
}
.param-row label {
  width: 110px; font-size: 11px; color: #64748b; flex-shrink: 0;
  text-align: right;
}
.param-row input[type="range"] { flex: 1; accent-color: #29B8D4; }
.param-row .param-val { width: 44px; font-size: 11px; color: #1a1a2e; text-align: left; font-variant-numeric: tabular-nums; }

/* 颜色行 */
.color-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.color-item { display: flex; align-items: center; gap: 6px; }
.color-item label { font-size: 11px; color: #64748b; }
.color-item input[type="color"] {
  width: 28px; height: 28px; border: 1px solid #cbd5e1; border-radius: 4px;
  padding: 1px; cursor: pointer;
}

/* ── 按钮 ── */
.btn {
  padding: 5px 10px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
  background: transparent; color: rgba(255,255,255,0.75); cursor: pointer;
  font-size: 11px; white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,0.1); }
.btn.primary { background: #29B8D4; border-color: #29B8D4; color: #fff; }
.btn.primary:hover { background: #22a3bc; }
</style>
</head>
<body>

<!-- ══ 顶栏 ══ -->
<div id="top-bar">
  <span class="title">卡片参数编辑器</span>
  <span class="sep">|</span>
  <span class="company" id="company-display">未指定公司</span>
  <span class="spacer"></span>
  <span class="preview-label">线框:</span>
  <button class="view-mode-btn active" data-mode="generic">内页 (2-8)</button>
  <button class="view-mode-btn" data-mode="cover">封面 (1)</button>
  <span class="preview-label">预览卡片:</span>
  <select id="preview-card-select">
    <option value="1">1</option>
    <option value="2" selected>2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
  </select>
  <span class="preview-label" id="preview-card-label">2</span>
  <span class="spacer"></span>
  <button class="btn" id="btn-load-defaults">加载默认</button>
  <button class="btn" id="btn-load-storage">读取本地</button>
  <button class="btn" id="btn-save-storage">保存到本地</button>
  <button class="btn" id="btn-import">导入 JSON</button>
  <button class="btn primary" id="btn-export">导出 JSON</button>
  <input type="file" id="import-file-input" accept=".json" style="display:none">
</div>

<!-- ══ 主体：Fabric 画布 + 实时预览 ══ -->
<div id="main-area">
  <div id="fabric-panel">
    <canvas id="fabric-canvas"></canvas>
  </div>
  <div id="preview-panel">
    <iframe id="preview-frame" src="about:blank"></iframe>
  </div>
</div>

<!-- ══ 控制面板 ══ -->
<div id="control-panel">

  <!-- 排版 -->
  <div class="panel-section" data-panel="typography">
    <div class="panel-section-header">
      <span class="toggle-icon">▾</span> 排版参数
    </div>
    <div class="panel-section-body">
      <div class="param-row">
        <label>fsHero (封面标题)</label>
        <input type="range" id="slider-fsHero" min="48" max="144" step="1" value="96">
        <span class="param-val" id="val-fsHero">96</span>
      </div>
      <div class="param-row">
        <label>fsS1 (章节标题)</label>
        <input type="range" id="slider-fsS1" min="24" max="72" step="1" value="40">
        <span class="param-val" id="val-fsS1">40</span>
      </div>
      <div class="param-row">
        <label>fsS2 (子章节)</label>
        <input type="range" id="slider-fsS2" min="16" max="48" step="1" value="30">
        <span class="param-val" id="val-fsS2">30</span>
      </div>
      <div class="param-row">
        <label>fsTagline (标语)</label>
        <input type="range" id="slider-fsTagline" min="28" max="84" step="1" value="56">
        <span class="param-val" id="val-fsTagline">56</span>
      </div>
      <div class="param-row">
        <label>fsBody (正文)</label>
        <input type="range" id="slider-fsBody" min="14" max="36" step="1" value="22">
        <span class="param-val" id="val-fsBody">22</span>
      </div>
      <div class="param-row">
        <label>fsBodySm (小正文)</label>
        <input type="range" id="slider-fsBodySm" min="10" max="26" step="1" value="17">
        <span class="param-val" id="val-fsBodySm">17</span>
      </div>
      <div class="param-row">
        <label>fsLabel (标签)</label>
        <input type="range" id="slider-fsLabel" min="8" max="20" step="1" value="11">
        <span class="param-val" id="val-fsLabel">11</span>
      </div>
      <div class="param-row">
        <label>lhBody (行高)</label>
        <input type="range" id="slider-lhBody" min="1.1" max="2.0" step="0.01" value="1.52">
        <span class="param-val" id="val-lhBody">1.52</span>
      </div>
    </div>
  </div>

  <!-- 颜色 -->
  <div class="panel-section" data-panel="colors">
    <div class="panel-section-header">
      <span class="toggle-icon">▾</span> 颜色
    </div>
    <div class="panel-section-body">
      <div class="color-grid">
        <div class="color-item">
          <label>强调色</label>
          <input type="color" class="param-color-input" data-param-key="colors.accent" value="#29B8D4">
        </div>
        <div class="color-item">
          <label>主文字</label>
          <input type="color" class="param-color-input" data-param-key="colors.inkPrimary" value="#0D0D0D">
        </div>
        <div class="color-item">
          <label>次文字</label>
          <input type="color" class="param-color-input" data-param-key="colors.inkMuted" value="rgba(0,0,0,0.50)">
        </div>
        <div class="color-item">
          <label>背景顶部</label>
          <input type="color" class="param-color-input" data-param-key="colors.bgGradientTop" value="#0B1629">
        </div>
        <div class="color-item">
          <label>背景中部</label>
          <input type="color" class="param-color-input" data-param-key="colors.bgGradientMid" value="#7080A0">
        </div>
        <div class="color-item">
          <label>背景下部</label>
          <input type="color" class="param-color-input" data-param-key="colors.bgGradientBottom" value="#FFFFFF">
        </div>
      </div>
    </div>
  </div>

  <!-- 间距 -->
  <div class="panel-section" data-panel="spacing">
    <div class="panel-section-header">
      <span class="toggle-icon">▾</span> 间距
    </div>
    <div class="panel-section-body">
      <div class="param-row">
        <label>fieldGap (字段间距)</label>
        <input type="range" id="slider-fieldGap" min="8" max="48" step="1" value="22">
        <span class="param-val" id="val-fieldGap">22</span>
      </div>
      <div class="param-row">
        <label>fieldPadY (字段内边距)</label>
        <input type="range" id="slider-fieldPadY" min="4" max="32" step="1" value="12">
        <span class="param-val" id="val-fieldPadY">12</span>
      </div>
      <div class="param-row">
        <label>sectionGap (章节间距)</label>
        <input type="range" id="slider-sectionGap" min="12" max="56" step="1" value="26">
        <span class="param-val" id="val-sectionGap">26</span>
      </div>
      <div class="param-row">
        <label>cardPadding (卡片边距)</label>
        <input type="range" id="slider-cardPadding" min="32" max="120" step="1" value="68">
        <span class="param-val" id="val-cardPadding">68</span>
      </div>
    </div>
  </div>

  <!-- 布局 -->
  <div class="panel-section" data-panel="layout">
    <div class="panel-section-header">
      <span class="toggle-icon">▾</span> 布局（内页）
    </div>
    <div class="panel-section-body">
      <div class="param-row">
        <label>图片位置 (%)</label>
        <input type="range" id="slider-imageTopPercent" min="20" max="48" step="1" value="33">
        <span class="param-val" id="val-imageTopPercent">33</span>
      </div>
      <div class="param-row">
        <label>图片最大高度 (%)</label>
        <input type="range" id="slider-imageMaxHeightPercent" min="15" max="40" step="1" value="28">
        <span class="param-val" id="val-imageMaxHeightPercent">28</span>
      </div>
      <div class="param-row">
        <label>图片宽度 (%)</label>
        <input type="range" id="slider-imageWidthPercent" min="60" max="95" step="1" value="86">
        <span class="param-val" id="val-imageWidthPercent">86</span>
      </div>
    </div>
  </div>
</div>

<script src="/canvas/js/param-editor.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const company = params.get('company') || '';
  if (!company) {
    document.getElementById('preview-panel').innerHTML =
      '<div class="no-preview">在 URL 中指定 ?company=&lt;公司名&gt; 加载预览</div>';
  }
  ParamEditor.init({ companyName: company });
});
</script>
</body>
</html>
