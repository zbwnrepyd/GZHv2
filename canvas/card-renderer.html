<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识卡片制作</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #F2F3F5;
    --panel: #FFFFFF;
    --border: #E1E5EC;
    --text: #111827;
    --muted: #667085;
    --cyan: #29B8D4;
    --danger: #D92D20;
  }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #card-workbench {
    display: grid;
    grid-template-columns: clamp(160px, 17vw, 210px) minmax(0, 1fr) clamp(320px, 36vw, 520px);
    height: 100vh;
    height: 100dvh;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  #left-pane, #right-pane {
    background: var(--panel);
    border-color: var(--border);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  #left-pane { border-right: 1px solid var(--border); }
  #right-pane { border-left: 1px solid var(--border); }
  .pane-head {
    height: 44px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
  }
  .pane-body {
    padding: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #card-nav {
    display: grid;
    gap: 7px;
  }
  .accordion-stack {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .left-accordion {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    overflow: hidden;
    flex: 0 0 auto;
    min-height: 0;
  }
  .left-accordion.is-open {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }
  .accordion-trigger {
    width: 100%;
    border: 0;
    background: transparent;
    flex: 0 0 auto;
    min-height: 36px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    color: #344054;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    text-align: left;
  }
  .accordion-trigger::after {
    content: "⌄";
    color: var(--muted);
    font-size: 13px;
    transition: transform .16s ease;
  }
  .left-accordion.is-open .accordion-trigger::after {
    transform: rotate(180deg);
  }
  .accordion-count {
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }
  .accordion-panel {
    border-top: 1px solid var(--border);
    padding: 8px;
    overflow: auto;
    min-height: 0;
  }
  .left-accordion:not(.is-open) .accordion-panel {
    display: none;
  }
  .card-tab {
    width: 100%;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: #475467;
    padding: 0 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    font-size: 12px;
  }
  .card-tab.active {
    border-color: var(--text);
    color: var(--text);
    background: #F8FAFC;
    font-weight: 800;
  }
  .card-tab.empty { opacity: .42; }
  #image-folder {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .image-folder-tools {
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 8px;
  }
  .bg-upload-label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  .bg-clear-btn { margin-top: 6px; }
  .image-folder-empty {
    grid-column: 1 / -1;
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .image-tile {
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    background: #FAFBFC;
    cursor: pointer;
    text-align: left;
  }
  .image-tile:hover {
    border-color: var(--cyan);
  }
  .image-tile.is-selected {
    border-color: var(--cyan);
    background: rgba(41, 184, 212, 0.10);
    box-shadow: 0 0 0 2px var(--cyan);
  }
  .image-thumb {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    background: #EEF2F7;
    object-fit: cover;
    display: block;
  }
  .image-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .company-display {
    width: 100%;
    min-height: 38px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    background: #F8FAFC;
    color: var(--text);
    font-size: 13px;
    font-weight: 800;
    line-height: 1.35;
    word-break: break-word;
  }
  .company-display.empty {
    color: var(--muted);
    font-weight: 700;
  }
  .btn {
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: #344054;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--cyan); }
  .btn.active {
    border-color: var(--cyan);
    background: rgba(41, 184, 212, .10);
    color: #0B5F70;
  }
  .btn.primary {
    background: #111827;
    border-color: #111827;
    color: #fff;
  }
  .btn.danger { color: var(--danger); }
  .btn.full-width { width: 100%; }
  .hidden-file-input { display: none; }
  #center-pane {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: grid;
    grid-template-rows: 44px minmax(0, 1fr) auto 24px;
  }
  #canvas-toolbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }
  #canvas-title {
    font-size: 13px;
    font-weight: 800;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .toolbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  #canvas-stage {
    position: relative;
    min-width: 0;
    min-height: 0;
    padding: 14px;
    overflow: hidden;
  }
  #card-frame {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 900px;
    height: 1200px;
    border: 0;
    background: #fff;
    box-shadow: 0 22px 54px rgba(15, 23, 42, .14);
    transform-origin: center center;
  }
  #status-msg {
    padding: 4px 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .source-code-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    min-height: 0;
    background: #0F172A;
    overflow: hidden;
  }
  .source-code-wrap::before {
    content: attr(data-source-view);
    position: absolute;
    right: 10px;
    top: 8px;
    z-index: 3;
    padding: 2px 7px;
    border: 1px solid rgba(148, 163, 184, .32);
    border-radius: 999px;
    background: rgba(15, 23, 42, .84);
    color: #94A3B8;
    font: 700 10px/1.4 "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase;
    pointer-events: none;
  }
  .source-code-wrap.is-inspecting {
    box-shadow: inset 0 0 0 2px rgba(41, 184, 212, .62);
  }
  #source-highlight, #source-editor {
    position: absolute;
    inset: 0;
    margin: 0;
    border: 0;
    padding: 14px;
    font: 12px/1.55 "SF Mono", Menlo, Consolas, monospace;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
  }
  #source-highlight {
    pointer-events: none;
    color: #D6DEFF;
  }
  #source-editor {
    resize: none;
    background: transparent;
    color: transparent;
    caret-color: #FFFFFF;
    outline: none;
    z-index: 2;
    -webkit-text-fill-color: transparent;
  }
  #source-editor::selection {
    background: rgba(41, 184, 212, .32);
  }
  .tok-tag { color: #7DD3FC; }
  .tok-attr { color: #F9E2AF; }
  .tok-string { color: #A7F3D0; }
  .tok-comment { color: #6B7280; font-style: italic; }
  .tok-punct { color: #94A3B8; }
  .tok-var { color: #C4B5FD; }
  .tok-prop { color: #93C5FD; }
  .tok-number { color: #FDBA74; }
  .tok-selector { color: #F0ABFC; }
  .source-actions {
    border-top: 1px solid var(--border);
    padding: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .source-actions .span-all { grid-column: 1 / -1; }
  .section {
    flex: 0 0 auto;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 10px;
  }
  .section.spaced { margin-top: 10px; }
  .section:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
  .hint {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
  /* ── 参数调节 Bar ── */
  #param-bar {
    background: var(--panel);
    border-top: 1px solid var(--border);
    max-height: 36px;
    overflow: hidden;
    transition: max-height .2s ease;
  }
  #param-bar.is-open {
    max-height: 200px;
    overflow-y: auto;
  }
  .param-bar-header {
    height: 36px;
    padding: 0 12px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
    background: #F8FAFC;
  }
  .param-bar-header:hover { background: #F1F5F9; }
  #param-bar-toggle {
    border: 0; background: none; padding: 0;
    font-size: 12px; font-weight: 700; color: #475569;
    cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  #param-bar-toggle .arrow { transition: transform .16s; display: inline-block; }
  #param-bar.is-open #param-bar-toggle .arrow { transform: rotate(180deg); }
  #param-bar-saved { font-size: 11px; color: var(--cyan); font-weight: 600; }
  .param-bar-body { padding: 0 12px 10px; }
  #param-bar:not(.is-open) .param-bar-body { display: none; }

  /* 2 列，每列可独立纵向滚动 */
  .param-sections {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }

  .param-section {
    border: 1px solid var(--border); border-radius: 6px;
    background: #fff; overflow: hidden;
  }
  .param-section-header {
    width: 100%; border: 0; background: #FAFBFC;
    padding: 6px 10px; font-size: 11px; font-weight: 700; color: #475569;
    cursor: pointer; text-align: left; user-select: none;
  }
  .param-section-header::before {
    content: '▾'; font-size: 9px; margin-right: 4px; transition: transform .15s;
  }
  .param-section-header.collapsed::before { transform: rotate(-90deg); }
  .param-section-content { padding: 8px 10px; }
  .param-section-header.collapsed + .param-section-content { display: none; }

  .param-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 5px;
  }
  .param-row label {
    width: 80px; min-width: 80px; font-size: 11px; color: var(--muted);
    text-align: right;
  }
  .param-row input[type="range"] {
    flex: 1; min-width: 60px; accent-color: var(--cyan);
    height: 18px; cursor: pointer;
  }
  .param-row .param-val {
    width: 36px; font-size: 11px; color: #1a1a2e; text-align: left;
    font-variant-numeric: tabular-nums;
  }

  .param-colors {
    display: flex; flex-direction: column; gap: 6px;
  }
  .param-color-item {
    display: flex; align-items: center; gap: 8px;
  }
  .param-color-item label {
    width: 56px; font-size: 11px; color: var(--muted); text-align: right;
  }
  .param-color-hex {
    width: 32px; height: 22px; border: 1px solid #CBD5E1; border-radius: 4px;
    padding: 0; cursor: pointer; background: none;
  }
  .param-color-text {
    width: 130px; height: 22px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 11px; padding: 0 6px; color: var(--text);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .param-color-swatch {
    width: 18px; height: 18px; border-radius: 3px;
    border: 1px solid rgba(0,0,0,.12); flex-shrink: 0;
  }

  .param-bar-actions {
    display: flex; gap: 8px; padding-top: 8px;
    border-top: 1px solid var(--border); margin-top: 8px;
  }
  .btn-sm { height: 26px; font-size: 11px; }

  /* ── iframe 双击编辑 ── */
  [contenteditable="true"] {
    outline: 2px solid var(--cyan) !important;
    background: rgba(41,184,212,.06);
  }

  @media (max-width: 900px) {
    #card-workbench {
      grid-template-columns: 132px minmax(0, 1fr) minmax(260px, 44vw);
    }
    .pane-head {
      padding: 0 8px;
    }
    .pane-body {
      padding: 8px;
    }
    #canvas-toolbar {
      padding: 0 8px;
      gap: 6px;
    }
    .toolbar-actions {
      gap: 4px;
    }
    .toolbar-actions .btn {
      padding: 0 7px;
    }
    #canvas-stage {
      padding: 8px;
    }
  }
</style>
</head>
<body>
<main id="card-workbench">
  <aside id="left-pane">
    <div class="pane-head">
      <span>卡片</span>
      <button class="btn" id="btn-reload">刷新</button>
    </div>
    <div class="pane-body">
      <div class="section">
        <div id="current-company-name" class="company-display empty">未选择项目</div>
      </div>
      <div class="accordion-stack">
        <section class="left-accordion is-open" id="cards-accordion">
          <button class="accordion-trigger" type="button" data-accordion-target="cards-accordion">
            卡片每一页 <span class="accordion-count" id="card-count">0/8</span>
          </button>
          <div class="accordion-panel">
            <nav id="card-nav"></nav>
            <div id="card3-toggle-row" style="display:none;margin-top:10px;padding:6px 0;border-top:1px solid var(--border)">
              <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer">
                <input type="checkbox" id="card3-show-image">
                显示图片
              </label>
            </div>
          </div>
        </section>
        <section class="left-accordion" id="templates-accordion">
          <button class="accordion-trigger" type="button" data-accordion-target="templates-accordion">
            模板 <span class="accordion-count" id="template-count">0</span>
          </button>
          <div class="accordion-panel">
            <nav id="template-list"></nav>
          </div>
        </section>
        <section class="left-accordion" id="image-folder-accordion">
          <button class="accordion-trigger" type="button" data-accordion-target="image-folder-accordion">
            图片夹 <span class="accordion-count" id="image-count">0</span>
          </button>
          <div class="accordion-panel">
            <div class="image-folder-tools">
              <label class="bg-upload-label">
                公众号 Logo
                <input class="hidden-file-input" type="file" accept="image/*" id="gzh-logo-input">
                <button class="btn full-width" type="button" onclick="document.getElementById('gzh-logo-input').click()">选择公众号 Logo</button>
              </label>
              <button class="btn full-width bg-clear-btn" style="margin-bottom:8px" type="button" onclick="Workbench.clearGzhLogo()">清除公众号 Logo</button>
              <label class="bg-upload-label">
                背景水印
                <input class="hidden-file-input" type="file" accept="image/*" id="bg-file-input">
                <button class="btn full-width" type="button" onclick="document.getElementById('bg-file-input').click()">选择本地图片</button>
              </label>
              <button class="btn full-width bg-clear-btn" type="button" onclick="BgLoader.clear();window.reloadCurrentCard&&window.reloadCurrentCard()">清除背景</button>
              <p class="hint">图片在研究完成后自动采集，手动管理请前往图片定稿台。</p>
            </div>
            <div id="image-folder">
              <p class="image-folder-empty">暂无图片。</p>
            </div>
          </div>
        </section>
      </div>
      <div class="section spaced">
        <button class="btn primary full-width" id="btn-export-all">导出全部 PNG</button>
        <p class="hint" id="export-path-hint">点击"导出全部 PNG"后，命令已复制到剪贴板，在终端粘贴执行。默认输出目录：output/cards/&lt;公司名&gt;/</p>
      </div>
    </div>
  </aside>

  <section id="center-pane">
    <div id="canvas-toolbar">
      <div id="canvas-title">卡片制作台</div>
      <div class="toolbar-actions">
        <a class="btn" id="btn-back-research" href="/editor">返回定稿台</a>
        <button class="btn" id="btn-fit">适配窗口</button>
<button class="btn primary" id="btn-export-current">导出当前</button>
<button class="btn" id="btn-param-editor">参数编辑器</button>
      </div>
    </div>
    <div id="canvas-stage">
      <iframe id="card-frame" title="卡片预览"></iframe>
    </div>
    <div id="param-bar">
      <div class="param-bar-header">
        <button id="param-bar-toggle"><span class="arrow">▸</span> 参数调节</button>
        <span id="param-bar-saved"></span>
      </div>
      <div class="param-bar-body" id="param-bar-body"></div>
    </div>
    <div id="status-msg">就绪</div>
  </section>

  <aside id="right-pane">
    <div class="pane-head">
      <span>HTML + CSS</span>
      <button class="btn danger" id="btn-reset-source">重置</button>
    </div>
    <div class="source-code-wrap">
      <pre id="source-highlight" aria-hidden="true"></pre>
      <textarea id="source-editor" spellcheck="false" wrap="off"></textarea>
    </div>
    <div class="source-actions">
      <button class="btn active" id="btn-source-all">全部</button>
      <button class="btn" id="btn-source-css">CSS</button>
      <button class="btn" id="btn-source-html">HTML</button>
      <button class="btn btn-sm" id="btn-inspect-source">检查元素</button>
      <button class="btn btn-sm" id="btn-import-template">导入模板</button>
      <button class="btn primary btn-sm" id="btn-save-template">保存模板</button>
    </div>
  </aside>
</main>

<script src="/canvas/js/markdown-parser.js"></script>
<script src="/canvas/js/render-data-loader.js"></script>
<script src="/canvas/js/template-renderer.js"></script>
<script src="/canvas/js/api-loader.js"></script>
<script src="/canvas/js/html-card-renderer.js"></script>
<script src="/canvas/js/source-editor.js"></script>
<script src="/canvas/js/export-client.js"></script>
<script src="/canvas/js/bg-loader.js"></script>
<script src="/canvas/js/param-controls.js"></script>
<script>
const CARD_TABS = {
  1: '首页',
  2: '公司',
  3: '沿袭',
  4: '主产品',
  5: '产品线',
  6: '商业',
  7: '竞争',
  8: '总结',
};

const Workbench = {
  companyName: '',
  currentCard: 1,
  allCardData: {},
  renderMode: 'legacy',
  renderCards: [],
  companyAssets: {},
  selectedImages: {},
  card3ShowImage: false,  // 卡片3默认文字排版
  gzhLogoUrl: '',         // 公众号 logo
  _activeTemplateIdx: -1, // 当前选中的模板索引
  paramOverrides: null,   // 参数覆盖（来自 ParamControls）

  async init() {
    BgLoader.init();
    const params = new URLSearchParams(window.location.search);
    this.companyName = params.get('company') || '';
    this.card3ShowImage = localStorage.getItem('aistartups.card3ShowImage') === 'true';
    this.gzhLogoUrl = localStorage.getItem('aistartups.gzhLogoUrl') || '/images/gzh-logo.jpg';
    this.updateCompanyDisplay();
    this.updateBackLink();
    this.bindEvents();
    this.renderNav();

    // 初始化参数控件
    ParamControls.init({
      onChange: (p) => this.onParamsChanged(p),
    });
    this.paramOverrides = ParamControls.getParams();

    await this.ensureDefaultTemplates();
    await this.renderTemplateList();
    SourceEditor.init({
      getCompanyName: () => this.companyName,
      getCurrentCard: () => this.currentCard,
      getCurrentSource: () => this.currentSource(),
      getDefaultSource: () => this.defaultSourceForCurrentCard(),
      refreshPreview: () => this.refreshPreview(),
      setStatus: (msg, type) => this.setStatus(msg, type),
      onTemplateSaved: () => this.renderTemplateList(),
    });
    SourceEditor.setSaveAllCardsCallback(() => this.saveAllCardsAsTemplate());

    if (this.companyName) {
      await this.loadCompany();
    } else {
      this.setStatus('请从定稿台进入，或通过 ?company= 公司名打开。', 'info');
    }
  },

  bindEvents() {
    this.bindAccordions();
    document.getElementById('btn-reload').addEventListener('click', () => this.loadCompany());
    document.getElementById('btn-fit').addEventListener('click', () => this.fitFrame());
    document.getElementById('btn-export-current').addEventListener('click', () => ExportClient.exportCurrent(this));
    document.getElementById('btn-export-all').addEventListener('click', () => ExportClient.exportAll(this));
    document.getElementById('btn-param-editor').addEventListener('click', (e) => {
      e.preventDefault();
      this.toggleParamBar();
    });
    // 参数 bar 折叠/展开
    document.getElementById('param-bar-toggle')?.addEventListener('click', (e) => {
      e.stopPropagation();
      this.toggleParamBar();
    });
    window.addEventListener('resize', () => this.updateFrameScale());
    const bgInput = document.getElementById('bg-file-input');
    if (bgInput) {
      bgInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        await BgLoader.loadFromFile(file);
        this.refreshPreview();
      });
    }
    // 公众号 Logo 上传
    const gzhInput = document.getElementById('gzh-logo-input');
    if (gzhInput) {
      gzhInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        this.setGzhLogoFromFile(file);
      });
    }
    // 卡片3 显示图片开关
    const card3Toggle = document.getElementById('card3-show-image');
    if (card3Toggle) {
      card3Toggle.checked = this.card3ShowImage;
      card3Toggle.addEventListener('change', () => {
        this.card3ShowImage = card3Toggle.checked;
        localStorage.setItem('aistartups.card3ShowImage', String(this.card3ShowImage));
        this.refreshPreview();
      });
    }
    // 模板导入 — 点击按钮动态创建文件选择器
    document.getElementById('btn-import-template')?.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = JSON.parse(reader.result);
            this.importTemplate(imported);
          } catch (err) {
            this.setStatus('模板文件解析失败：' + err.message, 'error');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    });
    window.reloadCurrentCard = () => this.refreshPreview();
  },

  bindAccordions() {
    const accordions = Array.from(document.querySelectorAll('.left-accordion'));
    document.querySelectorAll('.accordion-trigger').forEach((trigger) => {
      trigger.addEventListener('click', () => {
        const accordion = document.getElementById(trigger.dataset.accordionTarget);
        if (!accordion) return;
        accordion.classList.add('is-open');
        accordions.forEach((other) => {
          if (other !== accordion) other.classList.remove('is-open');
        });
      });
    });
  },

  updateCompanyDisplay() {
    const display = document.getElementById('current-company-name');
    if (!display) return;
    display.textContent = this.companyName || '未选择项目';
    display.classList.toggle('empty', !this.companyName);
  },

  updateBackLink() {
    const link = document.getElementById('btn-back-research');
    if (this.companyName) {
      link.href = `/editor?company=${encodeURIComponent(this.companyName)}`;
    } else {
      link.href = '/editor';
    }
  },

  async loadCompany() {
    if (!this.companyName) {
      this.setStatus('缺少公司名。', 'error');
      return;
    }
    try {
      this.setStatus(`正在加载 ${this.companyName}...`, 'info');
      const dynamic = await RenderDataLoader.load(this.companyName);
      const cards = RenderDataLoader.getSortedCards(dynamic);
      if (cards.length) {
        this.renderMode = 'dynamic';
        this.renderCards = cards;
        this.allCardData = {};
        cards.forEach((card) => {
          this.allCardData[card.card_id] = card;
        });
        this.companyAssets = await loadAssetsFromAPI(this.companyName);
        this.currentCard = cards[0].card_id;
        this.renderNav();
        this.renderImageFolder();
        await this.refreshPreview();
        this.setStatus(`已加载 ${dynamic.company_name || this.companyName} · ${cards.length} 张动态卡片`, 'success');
        return;
      }
    } catch (dynamicError) {
      RenderDataLoader.clearCache?.(this.companyName);
      this.setStatus(`动态渲染数据不可用，尝试旧版卡片：${dynamicError.message}`, 'info');
    }

    try {
      this.renderMode = 'legacy';
      this.renderCards = [];
      this.companyAssets = {};
      const result = await loadFromAPI(this.companyName);
      this.allCardData = result.allCardData || {};

      // 加载资产，合并到对应卡片的 _assets 字段
      const assets = await loadAssetsFromAPI(this.companyName);
      this.companyAssets = assets;
      for (let i = 1; i <= 8; i++) {
        if (!this.allCardData[i]) this.allCardData[i] = {};
        this.allCardData[i]._assets = assets;
        this.allCardData[i]._allAssets = assets;
      }

      this.currentCard = Number(Object.keys(this.allCardData)[0] || 1);
      this.renderNav();
      this.renderImageFolder();
      await this.refreshPreview();
      this.setStatus(`已加载 ${result.company_name || this.companyName}`, 'success');
    } catch (error) {
      this.allCardData = {};
      this.renderNav();
      this.renderImageFolder();
      this.setStatus(`加载失败：${error.message}`, 'error');
    }
  },

  renderNav() {
    const nav = document.getElementById('card-nav');
    nav.innerHTML = '';
    if (this.renderMode === 'dynamic') {
      this.renderCards.forEach((card) => {
        const button = document.createElement('button');
        button.className = 'card-tab';
        button.dataset.card = card.card_id;
        button.innerHTML = `<span>${card.card_index || ''} ${this.esc(card.card_title || card.card_id)}</span><span>${card.items?.length || 0}</span>`;
        button.classList.toggle('active', card.card_id === this.currentCard);
        button.addEventListener('click', async () => {
          SourceEditor.autoSaveCurrentCard(this.currentCard);
          this.currentCard = card.card_id;
          this.renderNav();
          this.renderTemplateList();
          await this.refreshPreview();
        });
        nav.appendChild(button);
      });
      const countEl = document.getElementById('card-count');
      if (countEl) countEl.textContent = String(this.renderCards.length);
      const toggleRow = document.getElementById('card3-toggle-row');
      if (toggleRow) toggleRow.style.display = 'none';
      return;
    }

    for (let i = 1; i <= 8; i += 1) {
      const button = document.createElement('button');
      button.className = 'card-tab';
      button.dataset.card = String(i);
      button.innerHTML = `<span>${i} ${this.cardLabel(i)}</span><span>${this.allCardData[i] ? '✓' : '·'}</span>`;
      button.classList.toggle('active', i === this.currentCard);
      button.classList.toggle('empty', !this.allCardData[i]);
      button.addEventListener('click', async () => {
        SourceEditor.autoSaveCurrentCard(this.currentCard);
        this.currentCard = i;
        this.renderNav();
        this.renderTemplateList();
        await this.refreshPreview();
      });
      nav.appendChild(button);
    }
    const count = Object.keys(this.allCardData).length;
    const countEl = document.getElementById('card-count');
    if (countEl) countEl.textContent = `${count}/8`;
    // 卡片3 图片开关只在卡片3时显示
    const toggleRow = document.getElementById('card3-toggle-row');
    if (toggleRow) toggleRow.style.display = this.currentCard === 3 ? '' : 'none';
  },

  cardLabel(cardIndex) {
    if (this.renderMode === 'dynamic') {
      return this.allCardData[cardIndex]?.card_title || this.allCardData[cardIndex]?._title || String(cardIndex);
    }
    return this.allCardData[cardIndex]?._title || CARD_TABS[cardIndex] || `卡片${cardIndex}`;
  },

  collectImages() {
    const images = [];
    const seen = new Set();
    const add = (cardIndex, src, source, assetKey = '') => {
      if (!src || seen.has(src)) return;
      seen.add(src);
      images.push({ cardIndex, src, source, assetKey });
    };

    // 服务器资产
    const assets = this.companyAssets || this.allCardData[1]?._assets || {};
    this.renderAllCompanyAssets(assets, add);

    for (const [cardIndex, data] of Object.entries(this.allCardData || {})) {
      add(Number(cardIndex), data?._image, '定稿图片');
      if (this.renderMode === 'dynamic') {
        (data.items || []).forEach((item) => {
          if (item.item_type === 'media') {
            add(data.card_index || 0, item.url || item.local_path, item.media_label || item.item_label || item.item_key, item.item_key);
          }
        });
      }
    }

    return images;
  },

  renderAllCompanyAssets(assets, add) {
    const keys = Array.isArray(DEMAND_ASSET_KEYS) ? DEMAND_ASSET_KEYS : Object.keys(assets || {});
    for (const assetKey of keys) {
      const asset = assets ? assets[assetKey] : null;
      if (asset && asset.local_path && asset.status === 'ready') {
        const cardIndex = Object.entries(CARD_ASSET_MAP).find(([, v]) => v === assetKey)?.[0];
        const label = ASSET_LABELS[assetKey] || assetKey;
        add(Number(cardIndex) || 0, asset.local_path, label, assetKey);
      }
    }
  },

  renderImageFolder() {
    const folder = document.getElementById('image-folder');
    const countEl = document.getElementById('image-count');
    if (!folder) return;

    const images = this.collectImages();
    if (countEl) countEl.textContent = String(images.length);
    if (!images.length) {
      folder.innerHTML = '<p class="image-folder-empty">暂无图片。</p>';
      return;
    }

    folder.innerHTML = images.map((image, index) => `
      <button class="image-tile" data-card="${image.cardIndex}" data-asset-key="${this.escAttr(image.assetKey || '')}" title="${image.cardIndex ? `卡片 ${image.cardIndex} · ` : ''}${this.esc(image.source)}">
        <img class="image-thumb" src="${this.escAttr(image.src)}" alt="">
        <div class="image-meta">${image.cardIndex ? `${image.cardIndex} · ` : ''}${this.esc(image.source || `图片${index + 1}`)}</div>
      </button>
    `).join('');

    const currentCardKey = String(this.currentCard);
    folder.querySelectorAll('.image-tile').forEach((button) => {
      const imgSrc = button.querySelector('.image-thumb')?.src;
      if (this.selectedImages[currentCardKey] === imgSrc) {
        button.classList.add('is-selected');
      }
      button.addEventListener('click', async () => {
        const src = button.querySelector('.image-thumb')?.src;
        const key = String(this.currentCard);
        if (this.selectedImages[key] === src) {
          delete this.selectedImages[key];
        } else {
          this.selectedImages[key] = src;
        }
        await this.refreshPreview();
      });
    });
  },

  cardUrl() {
    return `/canvas/card/${encodeURIComponent(this.companyName)}/${encodeURIComponent(this.currentCard)}?parent-driven=1`;
  },

  currentCardDataWithImage() {
    const cardData = Object.assign({}, this.allCardData[this.currentCard] || {});
    const selectedImage = this.selectedImages[String(this.currentCard)];
    if (this.renderMode === 'dynamic' && selectedImage) {
      const items = Array.isArray(cardData.items) ? cardData.items.slice() : [];
      items.unshift({
        item_type: 'media',
        item_key: 'manual_selected_image',
        item_label: '手动选择图片',
        media_label: '手动选择图片',
        display_role: 'hero_image',
        url: selectedImage,
        sort_order: -1,
      });
      cardData.items = items;
    }
    if (selectedImage) {
      cardData._selectedImage = selectedImage;
    }
    if (this.gzhLogoUrl) {
      cardData._gzhLogo = this.gzhLogoUrl;
    }
    return cardData;
  },

  defaultSourceForCurrentCard() {
    if (this.renderMode === 'dynamic') {
      return TemplateRenderer.render(this.currentCardDataWithImage());
    }
    return renderCardSource({
      companyName: this.companyName,
      cardIndex: this.currentCard,
      cardData: this.currentCardDataWithImage(),
      showImage: this.currentCard === 3 ? this.card3ShowImage : undefined,
      paramOverrides: this.paramOverrides,
    });
  },

  // 参数变更时：重新生成 source，直接注入 iframe（不刷新整个页面）
  onParamsChanged(params) {
    this.paramOverrides = params;
    const source = this.defaultSourceForCurrentCard();
    const frame = document.getElementById('card-frame');
    if (frame && frame.contentDocument) {
      try {
        renderSourceIntoDocument(frame.contentDocument, source);
        this._setupEditing(frame);
        // 同步更新源码编辑器
        if (SourceEditor && SourceEditor.setEditorValue) {
          SourceEditor.setEditorValue(source);
        }
      } catch (e) {
        // 跨域或未加载完成时走完整刷新
        this.refreshPreview();
      }
    }
  },

  // 切换参数 bar 展开/折叠
  toggleParamBar() {
    const bar = document.getElementById('param-bar');
    if (!bar) return;
    bar.classList.toggle('is-open');
  },

  // ── iframe 内双击编辑文字（始终开启）──
  _editSelectors: 'h1,h2,h3,p,.md-value,.md-label,.p1-title,.p1-tagline,.p1-type-section,.card-image-title',

  _onDblClick(e) {
    const el = e.target.closest(Workbench._editSelectors);
    if (!el || el.isContentEditable) return;
    e.preventDefault();
    el.contentEditable = 'true';
    el.focus();
    window.getSelection().selectAllChildren(el);
  },

  _onBlur(e) {
    if (!e.target.isContentEditable) return;
    e.target.contentEditable = 'false';
    Workbench._saveInlineEdit();
  },

  _onKeydown(e) {
    if (!e.target.isContentEditable) return;
    if (e.key === 'Escape') e.target.blur();
    else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.blur(); }
  },

  _saveInlineEdit() {
    const frame = document.getElementById('card-frame');
    if (!frame || !frame.contentDocument) return;
    const doc = frame.contentDocument;
    const article = doc.querySelector('.knowledge-card');
    if (!article) return;
    article.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
    const styleEl = doc.querySelector('style.card-dynamic');
    const css = styleEl ? styleEl.textContent : '';
    const source = `<style>\n${css}\n</style>\n${article.outerHTML.trim()}\n`;
    if (SourceEditor && SourceEditor.saveCurrentCard) {
      SourceEditor.saveCurrentCard(this.currentCard, source);
    }
    if (SourceEditor && SourceEditor.setEditorValue) {
      SourceEditor.setEditorValue(source);
    }
  },

  async refreshPreview() {
    // 刷新资产
    if (this.companyName) {
      const assets = await loadAssetsFromAPI(this.companyName);
      this.companyAssets = assets;
      if (this.renderMode !== 'dynamic') {
        for (let i = 1; i <= 8; i++) {
          if (!this.allCardData[i]) this.allCardData[i] = {};
          this.allCardData[i]._assets = assets;
          this.allCardData[i]._allAssets = assets;
        }
      }
    }

    const frame = document.getElementById('card-frame');
    frame.src = this.cardUrl();
    await new Promise((resolve) => {
      frame.onload = resolve;
    });
    const cardData = this.currentCardDataWithImage();
    const defaultSource = this.defaultSourceForCurrentCard();
    const source = SourceEditor.loadCurrentSource(defaultSource);
    SourceEditor.setEditorValue(source);
    SourceEditor.applyToFrame(frame, source);
    this._setupEditing(frame);
    const title = cardData.card_title || cardData._title || CARD_TABS[this.currentCard] || `卡片${this.currentCard}`;
    const indexLabel = cardData.card_index || this.currentCard;
    document.getElementById('canvas-title').textContent = `卡片${indexLabel} · ${title}`;
    this.renderImageFolder();
    this.updateFrameScale();
  },

  // 内容替换后重新挂编辑钩子
  _setupEditing(frame) {
    const doc = frame && frame.contentDocument;
    if (!doc) return;
    doc.addEventListener('dblclick', this._onDblClick);
    doc.addEventListener('blur', this._onBlur, true);
    doc.addEventListener('keydown', this._onKeydown, true);
  },

  currentSource() {
    return SourceEditor.getFullSource ? SourceEditor.getFullSource() : (document.getElementById('source-editor')?.value || '');
  },

  fitFrame() {
    this.updateFrameScale();
    this.setStatus('已适配窗口。', 'success');
  },

  updateFrameScale() {
    const stage = document.getElementById('canvas-stage');
    const frame = document.getElementById('card-frame');
    fitFrameToStage(stage, frame);
  },

  // ── 公众号 Logo ──
  async setGzhLogoFromFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      this.gzhLogoUrl = reader.result;
      localStorage.setItem('aistartups.gzhLogoUrl', this.gzhLogoUrl);
      this.refreshPreview();
      this.setStatus('公众号 Logo 已设置。', 'success');
    };
    reader.readAsDataURL(file);
  },

  clearGzhLogo() {
    this.gzhLogoUrl = '';
    localStorage.removeItem('aistartups.gzhLogoUrl');
    this.refreshPreview();
    this.setStatus('公众号 Logo 已清除。', 'success');
  },

  // ── 模板列表（全系统共享，不区分公司）──
  TEMPLATE_KEY: 'aistartups.templates',

  async ensureDefaultTemplates() {
    try {
      const existing = localStorage.getItem(this.TEMPLATE_KEY);
      if (existing) {
        const parsed = JSON.parse(existing);
        if (parsed._sets && parsed._sets.length > 0) return;
      }
      const resp = await fetch('/canvas/default-templates.json');
      if (resp.ok) {
        const data = await resp.json();
        localStorage.setItem(this.TEMPLATE_KEY, JSON.stringify(data));
      }
    } catch { /* 加载失败则用空模板 */ }
  },

  loadTemplates() {
    try {
      return JSON.parse(localStorage.getItem(this.TEMPLATE_KEY) || '{}');
    } catch { return {}; }
  },

  saveTemplates(map) {
    localStorage.setItem(this.TEMPLATE_KEY, JSON.stringify(map));
  },

  importTemplate(imported) {
    // 支持导入模板集（{_sets:[...]}）或单个模板集
    const map = this.loadTemplates();
    const sets = map._sets || [];
    let added = 0;

    const toImport = imported._sets || (imported.name && imported.cards ? [imported] : []);
    for (const set of toImport) {
      if (!set.name || !set.cards) continue;
      sets.push({
        name: set.name,
        cards: set.cards,
        createdAt: set.createdAt || new Date().toLocaleDateString('zh'),
      });
      added++;
    }
    map._sets = sets;
    this.saveTemplates(map);
    this.renderTemplateList();
    this.setStatus(`已导入 ${added} 个模板集。`, 'success');
  },

  // 保存当前启用卡片为模板集
  saveAllCardsAsTemplate() {
    const map = this.loadTemplates();
    const sets = map._sets || [];
    const name = prompt('模板集名称：', `模板集-${sets.length + 1}`);
    if (!name) return;

    // 收集当前卡片源码。动态模式按 render-data 返回的启用卡片，旧模式保留 1..8。
    const cards = {};
    const savedCard = this.currentCard;
    const cardIds = this.renderMode === 'dynamic'
      ? this.renderCards.map(card => card.card_id)
      : Array.from({ length: 8 }, (_, i) => i + 1);
    for (const cardId of cardIds) {
      this.currentCard = cardId;
      const cardData = this.currentCardDataWithImage();
      cards[String(cardId)] = this.renderMode === 'dynamic'
        ? TemplateRenderer.render(cardData)
        : renderCardSource({
          companyName: this.companyName,
          cardIndex: cardId,
          cardData,
          showImage: cardId === 3 ? this.card3ShowImage : undefined,
        });
    }
    this.currentCard = savedCard;

    const now = new Date();
    const createdAt = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    sets.push({ name: name.trim(), cards, createdAt });
    map._sets = sets;
    this.saveTemplates(map);
    this.renderTemplateList();
    this.setStatus(`模板集"${name.trim()}"已保存（${cardIds.length}张卡片）。`, 'success');
  },

  exportAllTemplates() {
    const map = this.loadTemplates();
    const blob = new Blob([JSON.stringify(map, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'aistartups-templates.json';
    a.click();
    URL.revokeObjectURL(url);
  },

  async renderTemplateList() {
    const nav = document.getElementById('template-list');
    const countEl = document.getElementById('template-count');

    // 如果 localStorage 无模板数据，先尝试加载默认集
    if (!localStorage.getItem(this.TEMPLATE_KEY)) {
      await this.ensureDefaultTemplates();
    }

    const map = this.loadTemplates();
    const sets = map._sets || [];
    if (countEl) countEl.textContent = String(sets.length);

    if (nav) {
      if (!sets.length) {
        nav.innerHTML = '<p style="padding:8px;font-size:12px;color:var(--muted)">暂无模板。<br>编辑源码后点"保存模板"保存当前启用卡片。</p>';
      } else {
        nav.innerHTML = sets.map((s, idx) => {
          const isActive = idx === this._activeTemplateIdx;
          return `
          <button class="card-tab template-tab ${isActive ? 'active' : ''}" data-idx="${idx}" style="justify-content:flex-start;gap:6px">
            <span style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${this.esc(s.name)}</span>
            <span style="font-size:10px;color:var(--muted)">${this.esc(s.createdAt || '')}</span>
          </button>
        `;}).join('');
        nav.querySelectorAll('.template-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.idx);
            const allSets = (this.loadTemplates()._sets || []);
            const set = allSets[idx];
            if (set && set.cards && set.cards[String(this.currentCard)]) {
              SourceEditor.setEditorValue(set.cards[String(this.currentCard)]);
              SourceEditor.previewEditorSource();
              this._activeTemplateIdx = idx;
              this.renderTemplateList();
              this.setStatus(`已加载模板集"${set.name}"的卡片${this.currentCard}。`, 'success');
            }
          });
        });
      }
    }
  },

  setStatus(message, type = 'info') {
    const el = document.getElementById('status-msg');
    el.textContent = message;
    el.dataset.type = type;
  },

  esc(value) {
    return String(value || '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;',
    }[ch]));
  },

  escAttr(value) {
    return this.esc(value).replace(/`/g, '&#096;');
  },
};

function fitFrameToStage(stage, frame) {
  if (!stage || !frame) return 1;
  const rect = stage.getBoundingClientRect();
  const availableWidth = Math.max(0, rect.width - 28);
  const availableHeight = Math.max(0, rect.height - 28);
  const scale = Math.min(availableWidth / 900, availableHeight / 1200, 1);
  frame.style.left = '50%';
  frame.style.top = '50%';
  frame.style.transform = `translate(-50%, -50%) scale(${scale})`;
  return scale;
}
