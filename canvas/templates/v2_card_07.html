<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root { --navy: #1B2A4A; --cyan: #29B8D4; --gray: #6B7A8D; --bg: #F7F8FA; --card-w: 900px; --card-h: 1200px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: var(--card-w); height: var(--card-h); background: #fff; overflow: hidden; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
  .card { width: 900px; height: 1200px; padding: 56px 64px; display: flex; flex-direction: column; }
  .card-label { font-size: 12px; color: var(--cyan); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; font-weight: 600; }
  .card-title { font-size: 32px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
  .card-subtitle { font-size: 15px; color: var(--gray); margin-bottom: 36px; }

  .hero { width: 100%; height: 400px; border-radius: 12px; overflow: hidden; margin-bottom: 32px; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .hero img { width: 100%; height: 100%; object-fit: contain; }
  .hero-placeholder { color: var(--gray); font-size: 14px; }

  .content-section { flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .section-title { font-size: 13px; color: var(--gray); font-weight: 500; letter-spacing: 0.03em; margin-bottom: 6px; }
  .body-text { font-size: 14px; color: var(--navy); line-height: 1.7; }
  .moat-block { background: var(--bg); border-radius: 10px; padding: 18px 22px; }
  .competitor-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .competitor-card { background: var(--bg); border-radius: 8px; padding: 14px; text-align: center; }
  .competitor-card .c-name { font-size: 15px; color: var(--navy); font-weight: 700; margin-bottom: 2px; }
  .competitor-card .c-data { font-size: 11px; color: var(--gray); }

  .card-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid #E8ECF2; display: flex; justify-content: space-between; align-items: center; }
  .brand-mark { font-size: 18px; color: var(--cyan); }
  .page-num { font-size: 12px; color: var(--gray); }
</style>
</head>
<body>
<div class="card" id="page7">
  <div class="card-label">Competition</div>
  <h1 class="card-title">竞争格局</h1>
  <p class="card-subtitle" id="competitors-summary"></p>

  <div class="hero" id="hero-block">
    <img id="hero-img" src="" alt="" onerror="this.parentElement.innerHTML='<div class=hero-placeholder>竞争格局图</div>'">
  </div>

  <div class="content-section">
    <div class="moat-block">
      <div class="section-title">竞争壁垒</div>
      <p class="body-text" id="moat-text">—</p>
    </div>
    <div>
      <div class="section-title">Top 3 竞争对手</div>
      <div class="competitor-grid" id="competitor-grid"></div>
    </div>
  </div>

  <div class="card-footer"><span class="brand-mark">∞</span><span class="page-num">7 / 7</span></div>
</div>

<script>
const D = window.__CARD_DATA__ || {};
document.getElementById("competitors-summary").textContent = D.competitors_summary || "";
document.getElementById("moat-text").textContent = D.moat || "暂缺";

// 解析 competitors_summary 为三列
const summary = D.competitors_summary || "";
const entries = summary.split(/【|】/).filter(s => s.trim() && s.includes("："));
const grid = document.getElementById("competitor-grid");
if (entries.length) {
  entries.slice(0,3).forEach(e => {
    const parts = e.split(/：|:/, 2);
    const div = document.createElement("div");
    div.className = "competitor-card";
    div.innerHTML = '<div class="c-name">'+(parts[0]||"").trim()+'</div><div class="c-data">'+(parts[1]||"").trim()+'</div>';
    grid.appendChild(div);
  });
} else {
  document.querySelector(".competitor-grid").innerHTML = '<div style="color:var(--gray);font-size:13px;grid-column:1/-1;text-align:center">暂缺竞品详情</div>';
}

const img = document.getElementById("hero-img");
if (img) img.src = (D.media && (D.media.chart_competitive || D.media.competitors_logo_strip)) || "";
</script>
</body>
</html>
