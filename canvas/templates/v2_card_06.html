<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root { --ink: #2D2F33; --navy: #1B2A4A; --cyan: #35BBD5; --card-w: 900px; --card-h: 1200px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: var(--card-w);
    height: var(--card-h);
    overflow: hidden;
    background: #FFFFFF;
    font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    color: var(--ink);
  }
  .card {
    width: 900px;
    height: 1200px;
    padding: 58px 58px 64px;
    display: flex;
    flex-direction: column;
  }
  .card-title {
    font-size: 42px;
    line-height: 1.12;
    font-weight: 900;
    letter-spacing: 0;
    color: var(--ink);
  }
  .flywheel-stage {
    width: 100%;
    height: 452px;
    margin: 34px 0 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .flywheel-stage img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .flywheel-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--navy);
    font-size: 24px;
    font-weight: 800;
  }
  .body-copy {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 0 0 0 0;
    font-size: 23px;
    line-height: 1.48;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--ink);
  }
  .body-copy p {
    white-space: pre-line;
  }
</style>
</head>
<body>
<div class="card" id="page6">
  <h1 class="card-title">增长飞轮与GTM策略</h1>

  <div class="flywheel-stage" id="hero-block">
    <img id="hero-img" src="" alt="" onerror="this.parentElement.innerHTML='<div class=flywheel-placeholder>增长飞轮</div>'">
  </div>

  <section class="body-copy">
    <p id="gtm-text">—</p>
    <p id="flywheel-text">—</p>
  </section>
</div>

<script>
const D = window.__CARD_DATA__ || {};
document.getElementById("gtm-text").textContent = D.gtm_strategy || "暂缺";
document.getElementById("flywheel-text").textContent = D.growth_flywheel || "暂缺";
const img = document.getElementById("hero-img");
if (img) img.src = (D.media && D.media.flywheel) || "";
</script>
</body>
</html>
