<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aistartups.cn — 模板制作</title>
<link rel="icon" type="image/jpeg" href="/images/gzh-logo.jpg">
<link rel="apple-touch-icon" href="/images/gzh-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/gzh2-base.css">
<style>
  /* 模板制作页面特有 */
  .tm-canvas-preview { position: relative; box-shadow: 0 4px 24px rgba(0,0,0,0.10); border-radius: var(--radius); background: var(--white); }
  .tm-canvas-preview iframe { border: none; display: block; transform-origin: top left; }
  .region-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; }
  .region-item:hover { background: rgba(41,184,212,0.05); }
  .region-item.active { background: rgba(41,184,212,0.12); font-weight: 600; }
  .region-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body data-od-id="page-template-maker">

<header class="top-bar" data-od-id="tm-topbar">
  <a href="/"><img src="/images/gzh-logo.jpg" class="topbar-logo" alt="aistartups.cn"></a>
  <a href="javascript:history.back()">← 返回</a>
  <span>模板制作</span>
  <span class="spacer"></span>
  <span class="od-status" id="template-status">未保存</span>
  <input id="template-name" placeholder="模板名称" style="width:140px;background:transparent;color:var(--white);border-color:rgba(255,255,255,0.3);font-size:13px">
  <button class="btn btn-accent btn-sm" onclick="TemplateMaker.save()">保存</button>
  <select id="existing-template-select" style="width:140px;background:transparent;color:var(--white);border-color:rgba(255,255,255,0.3);font-size:12px;padding:3px 6px;border-radius:4px">
    <option value="">-- 选择已有模板 --</option>
  </select>
</header>

<div class="main-layout" data-od-id="tm-main">
  <!-- 左：画布设置 + 区域列表 -->
  <aside class="panel panel-left" data-od-id="tm-left">
    <div class="section-title">画布</div>
    <div class="btn-row">
      <label>宽 <input type="number" value="900" id="canvas-w" onchange="TemplateMaker._updateCanvas()"></label>
      <label>高 <input type="number" value="1200" id="canvas-h" onchange="TemplateMaker._updateCanvas()"></label>
    </div>
    <label>背景类型
      <select id="bg-type" onchange="TemplateMaker._updateCanvas()">
        <option value="color">纯色</option>
        <option value="gradient">渐变</option>
      </select>
    </label>
    <label>背景值 <input type="text" id="bg-value" value="#FFFFFF" onchange="TemplateMaker._updateCanvas()"></label>

    <div class="section-title" style="margin-top:14px">区域</div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" onclick="TemplateMaker._addRegion('text')">+ 文字</button>
      <button class="btn btn-outline btn-sm" onclick="TemplateMaker._addRegion('image')">+ 图片</button>
      <button class="btn btn-outline btn-sm" onclick="TemplateMaker._addRegion('shape')">+ 形状</button>
    </div>
    <div id="region-list" style="margin-top:8px"></div>
  </aside>

  <!-- 中：Canvas 预览 -->
  <main class="panel-center" data-od-id="tm-center">
    <div id="canvas-preview-container"></div>
  </main>

  <!-- 右：区域属性 -->
  <aside class="panel panel-right" data-od-id="tm-right">
    <div class="section-title">区域属性</div>
    <div id="region-props">
      <div class="empty-state">选择区域编辑属性</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" onclick="TemplateMaker._duplicateRegion()">复制区域</button>
      <button class="btn btn-outline btn-sm" onclick="TemplateMaker._deleteRegion()" style="color:var(--red);border-color:var(--red)">删除区域</button>
    </div>
  </aside>
</div>

<script>
const TemplateMaker = {
  _regions: [],
  _activeIdx: -1,
  _tplId: '',

  async init() {
    const p = new URLSearchParams(window.location.search);
    const tplId = p.get('template_id');
    this._tplId = tplId || `custom_${Date.now()}`;
    this._isEditing = !!tplId;

    // 加载模板列表到下拉框
    await this._loadTemplateList(tplId);

    // 加载已有模板
    if (tplId) {
      await this._loadTemplate(tplId);
    }

    // 没有模板则用默认
    if (!this._regions.length) {
      this._regions = [
        { id: 'title', type: 'text', role: 'title', x: 68, y: 80, w: 764, h: 90, style: { fontFamily: 'Noto Sans SC', fontSize: 48, fontWeight: 700, color: '#111', textAlign: 'left' } },
        { id: 'body', type: 'text', role: 'body', x: 68, y: 200, w: 764, h: 900, style: { fontFamily: 'Noto Sans SC', fontSize: 24, fontWeight: 400, color: '#333', lineHeight: 1.55 } },
      ];
    }

    document.getElementById('existing-template-select').addEventListener('change', (e) => {
      if (!e.target.value) return;
      if (confirm('加载此模板将覆盖当前编辑内容，确定？')) {
        window.location.search = `?template_id=${encodeURIComponent(e.target.value)}`;
      }
    });

    this._renderAll();
    this._preview();
  },

  async _loadTemplateList(selectedId) {
    try {
      const r = await fetch('/api/templates');
      if (!r.ok) return;
      const data = await r.json();
      const templates = data.templates || [];
      const sel = document.getElementById('existing-template-select');
      templates.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.template_id;
        opt.textContent = t.template_name;
        if (t.template_id === selectedId) opt.selected = true;
        sel.appendChild(opt);
      });
    } catch (e) { /* non-blocking */ }
  },

  async _loadTemplate(tplId) {
    try {
      const r = await fetch(`/api/templates/${encodeURIComponent(tplId)}`);
      if (r.ok) {
        const tpl = await r.json();
        const json = (typeof tpl.template_json === 'string') ? JSON.parse(tpl.template_json) : tpl.template_json;
        this._regions = json.regions || [];
        const canvas = json.canvas || {};
        document.getElementById('canvas-w').value = canvas.width || 900;
        document.getElementById('canvas-h').value = canvas.height || 1200;
        const bg = json.background || {};
        document.getElementById('bg-type').value = bg.type || 'color';
        document.getElementById('bg-value').value = bg.value || '#FFFFFF';
        document.getElementById('template-name').value = tpl.template_name || '';
        document.getElementById('template-status').textContent = '已加载';
      }
    } catch (e) {
      document.getElementById('template-status').textContent = '加载失败';
    }
  },

  _renderAll() {
    this._renderRegionList();
    if (this._activeIdx >= 0 && this._activeIdx < this._regions.length) {
      this._renderProps(this._regions[this._activeIdx]);
    }
  },

  _renderRegionList() {
    const el = document.getElementById('region-list');
    el.innerHTML = this._regions.map((r, i) => `
      <div class="region-item ${i === this._activeIdx ? 'active' : ''}" onclick="TemplateMaker._selectRegion(${i})">
        <span class="region-dot" style="background:${r.type==='text'?'var(--cyan)':r.type==='image'?'var(--green)':'var(--text-subtle)'}"></span>
        <span>${this._esc(r.id)}</span>
        <span style="color:var(--text-subtle);margin-left:auto;font-size:10px">${r.type} / ${r.role||'-'}</span>
      </div>
    `).join('');
  },

  _selectRegion(idx) {
    this._activeIdx = idx;
    this._renderAll();
  },

  _renderProps(r) {
    const roles = ['title','subtitle','body','caption','logo','hero_image','chart','decoration','background'];
    const fonts = ['Noto Sans SC','Instrument Sans','Bebas Neue','IBM Plex Mono'];
    const el = document.getElementById('region-props');
    const s = r.style || {};
    el.innerHTML = `
      <label>ID <input value="${this._esc(r.id)}" data-key="id" onchange="TemplateMaker._onProp('id',this.value)"></label>
      <label>角色 <select data-key="role" onchange="TemplateMaker._onProp('role',this.value)">
        ${roles.map(ro => `<option ${r.role===ro?'selected':''}>${ro}</option>`).join('')}
      </select></label>
      <div class="btn-row">
        <label>X <input type="number" value="${r.x}" onchange="TemplateMaker._onProp('x',parseFloat(this.value))" style="width:60px"></label>
        <label>Y <input type="number" value="${r.y}" onchange="TemplateMaker._onProp('y',parseFloat(this.value))" style="width:60px"></label>
        <label>W <input type="number" value="${r.w}" onchange="TemplateMaker._onProp('w',parseFloat(this.value))" style="width:60px"></label>
        <label>H <input type="number" value="${r.h}" onchange="TemplateMaker._onProp('h',parseFloat(this.value))" style="width:60px"></label>
      </div>
      ${r.type === 'text' ? `
        <label>字体 <select onchange="TemplateMaker._onStyle('fontFamily',this.value)">
          ${fonts.map(f => `<option ${s.fontFamily===f?'selected':''}>${f}</option>`).join('')}
        </select></label>
        <label style="display:flex;align-items:center;gap:8px">字号<span style="font-size:10px;color:var(--text-subtle);min-width:28px">${s.fontSize||24}px</span>
          <input type="range" min="10" max="96" value="${s.fontSize||24}" oninput="TemplateMaker._onStyle('fontSize',parseInt(this.value))" style="flex:1"></label>
        <label style="display:flex;align-items:center;gap:8px">字重<span style="font-size:10px;color:var(--text-subtle);min-width:28px">${s.fontWeight||400}</span>
          <input type="range" min="100" max="900" step="100" value="${s.fontWeight||400}" oninput="TemplateMaker._onStyle('fontWeight',parseInt(this.value))" style="flex:1"></label>
        <label>颜色 <input type="color" value="${s.color||'#111'}" onchange="TemplateMaker._onStyle('color',this.value)"></label>
        <label>行高 <input type="number" step="0.1" min="1" max="3" value="${s.lineHeight||1.5}" onchange="TemplateMaker._onStyle('lineHeight',parseFloat(this.value))"></label>
      ` : ''}
      ${r.type === 'image' ? `
        <label>圆角 <span style="font-size:10px;color:var(--text-subtle)">${s.borderRadius||0}px</span>
          <input type="range" min="0" max="40" value="${s.borderRadius||0}" oninput="TemplateMaker._onStyle('borderRadius',parseInt(this.value))"></label>
        <label>适应方式 <select onchange="TemplateMaker._onStyle('objectFit',this.value)">
          <option ${s.objectFit==='contain'?'selected':''}>contain</option>
          <option ${s.objectFit==='cover'?'selected':''}>cover</option>
        </select></label>
      ` : ''}
    `;
  },

  _onProp(key, val) {
    if (this._activeIdx < 0) return;
    this._regions[this._activeIdx][key] = val;
    this._preview();
    this._renderAll();
  },
  _onStyle(key, val) {
    if (this._activeIdx < 0) return;
    this._regions[this._activeIdx].style = this._regions[this._activeIdx].style || {};
    this._regions[this._activeIdx].style[key] = val;
    this._preview();
  },

  _addRegion(type) {
    const id = `${type}_${this._regions.length + 1}`;
    this._regions.push({
      id, type, role: type === 'text' ? 'body' : 'hero_image',
      x: 100, y: 100 + this._regions.length * 40, w: type === 'text' ? 700 : 300, h: type === 'text' ? 200 : 200,
      style: type === 'text' ? { fontFamily:'Noto Sans SC',fontSize:24,fontWeight:400,color:'#333' } : { objectFit:'contain' },
    });
    this._activeIdx = this._regions.length - 1;
    this._renderAll();
    this._preview();
  },

  _deleteRegion() {
    if (this._activeIdx < 0 || !confirm('删除当前区域？')) return;
    this._regions.splice(this._activeIdx, 1);
    this._activeIdx = -1;
    document.getElementById('region-props').innerHTML = '<div class="empty-state">选择区域编辑属性</div>';
    this._renderAll();
    this._preview();
  },
  _duplicateRegion() {
    if (this._activeIdx < 0) return;
    const r = JSON.parse(JSON.stringify(this._regions[this._activeIdx]));
    r.id = r.id + '_copy';
    this._regions.push(r);
    this._activeIdx = this._regions.length - 1;
    this._renderAll();
    this._preview();
  },

  _updateCanvas() { this._preview(); },

  /* ── 预览 ── */
  _preview() {
    const w = parseInt(document.getElementById('canvas-w')?.value || 900);
    const h = parseInt(document.getElementById('canvas-h')?.value || 1200);
    const bgType = document.getElementById('bg-type')?.value || 'color';
    const bgVal = document.getElementById('bg-value')?.value || '#FFFFFF';
    const bg = bgType === 'gradient' ? `background:${bgVal};` : `background:${bgVal};`;

    const regionsHTML = this._regions.map(r => {
      const s = r.style || {};
      const css = [
        `position:absolute;left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`,
        s.fontFamily ? `font-family:'${s.fontFamily}',sans-serif` : '',
        s.fontSize ? `font-size:${s.fontSize}px` : '',
        s.fontWeight ? `font-weight:${s.fontWeight}` : '',
        s.color ? `color:${s.color}` : '',
        s.lineHeight ? `line-height:${s.lineHeight}` : '',
        s.borderRadius ? `border-radius:${s.borderRadius}px` : '',
        s.objectFit ? `object-fit:${s.objectFit}` : '',
        'overflow:hidden',
      ].filter(Boolean).join(';');
      if (r.type === 'image') return `<div style="${css}display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.03);color:rgba(0,0,0,0.18);font-size:13px">[${r.id}]</div>`;
      if (r.type === 'shape') return `<div style="${css}background:rgba(0,0,0,0.03);border:1px dashed rgba(0,0,0,0.12)"></div>`;
      return `<div style="${css}text-align:${s.textAlign||'left'}">[${r.id}:${r.role||'text'}]<br><span style="font-size:70%;color:rgba(0,0,0,0.15)">${r.role||'body'} 区域</span></div>`;
    }).join('');

    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;700;900&display=swap');*{margin:0;padding:0;box-sizing:border-box}body{width:${w}px;height:${h}px;position:relative;${bg}}</style></head><body><div style="position:absolute;inset:0;opacity:0.04;pointer-events:none;z-index:1;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.7%22/></filter><rect width=%22200%22 height=%22200%22 filter=%22url(%23n)%22 opacity=%220.5%22/></svg>')"></div>${regionsHTML}</body></html>`;

    const container = document.getElementById('canvas-preview-container');
    const scale = Math.min((container.parentElement.clientWidth - 40) / w, (container.parentElement.clientHeight - 40) / h, 1.0);
    container.innerHTML = `<div class="tm-canvas-preview" style="width:${w*scale}px;height:${h*scale}px"><iframe srcdoc="${this._escAttr(html)}" style="width:${w}px;height:${h}px;transform:scale(${scale});transform-origin:top left"></iframe></div>`;
  },

  /* ── 保存模板 ── */
  async save() {
    const name = document.getElementById('template-name')?.value || '未命名模板';
    const w = parseInt(document.getElementById('canvas-w')?.value || 900);
    const h = parseInt(document.getElementById('canvas-h')?.value || 1200);
    const bgType = document.getElementById('bg-type')?.value || 'color';
    const bgVal = document.getElementById('bg-value')?.value || '#FFFFFF';

    const tplJSON = {
      canvas: { width: w, height: h },
      background: { type: bgType, value: bgVal },
      regions: this._regions,
      decorations: [{ id: 'grain', type: 'noise', opacity: 0.04 }],
    };

    try {
      const method = this._isEditing ? 'PATCH' : 'POST';
      const url = this._isEditing
        ? `/api/templates/${encodeURIComponent(this._tplId)}`
        : '/api/templates';
      const r = await fetch(url, {
        method, headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ template_id: this._tplId, template_name: name, template_json: tplJSON }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error + ': ' + (d.errors || []).join(', '));
      const st = document.getElementById('template-status');
      if (st) st.textContent = '已保存';
      alert(`模板 "${name}" 保存成功！${this._isEditing ? '（已更新）' : ''}`);
    } catch (e) { alert('保存失败: ' + e.message); }
  },

  /* ── template-checks: 自检反馈 ── */
  _validateTemplate() {
    const issues = [];
    const hasTitle = this._regions.some(r => r.role === 'title');
    const hasBody = this._regions.some(r => r.role === 'body');
    if (!hasTitle) issues.push('缺少 title 角色区域');
    if (!hasBody) issues.push('缺少 body 角色区域');
    const st = document.getElementById('template-status');
    if (st) {
      st.textContent = issues.length ? `⚠ ${issues.join(', ')}` : '已保存';
      st.style.color = issues.length ? 'var(--red)' : '';
    }
    return issues.length === 0;
  },

  _esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); },
  _escAttr(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); },
};

document.addEventListener('DOMContentLoaded', () => TemplateMaker.init());
</script>
</body>
</html>
