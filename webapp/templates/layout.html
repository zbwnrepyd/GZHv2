<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aistartups.cn — 排版界面</title>
<link rel="icon" type="image/jpeg" href="/images/gzh-logo.jpg">
<link rel="apple-touch-icon" href="/images/gzh-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/gzh2-base.css">
<style>
  /* 排版页面特有微调 */
  .panel-left { width: 240px; }
  .canvas-stage iframe { pointer-events: none; }
  .layer-item { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .layer-item:hover { background: rgba(41,184,212,0.06); }
  .layer-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .prop-row { display: flex; gap: 6px; }
  .prop-row label { flex: 1; }
</style>
</head>
<body data-od-id="page-layout">

<header class="top-bar" data-od-id="layout-topbar">
  <a href="/"><img src="/images/gzh-logo.jpg" class="topbar-logo" alt="aistartups.cn"></a>
  <a href="/">← 研究台</a>
  <a href="#" id="btn-back-editor">← 定稿台</a>
  <span class="company-name" id="company-label"></span>
  <span class="od-status" id="layout-status">未加载</span>
  <span class="spacer"></span>
  <button class="btn btn-outline btn-sm" id="btn-template-maker" style="color:var(--white);border-color:rgba(255,255,255,0.3)">模板制作</button>
  <button class="btn btn-accent btn-sm" id="btn-export">导出 PNG</button>
</header>

<div class="main-layout" data-od-id="layout-main">
  <!-- 左：卡片列表 + 模板选择 + 图层 -->
  <aside class="panel panel-left" data-od-id="layout-left">
    <div class="section-title">卡片列表</div>
    <div id="card-list"></div>

    <div class="section-title" style="margin-top:16px">模板</div>
    <select id="template-select"></select>
    <div class="btn-row">
      <button class="btn btn-outline btn-sm" id="btn-apply-template">应用模板</button>
    </div>

    <div class="section-title" style="margin-top:16px">图层</div>
    <div id="layer-list"></div>
  </aside>

  <!-- 中：Canvas 预览 -->
  <main class="panel-center" id="canvas-area" data-od-id="layout-center">
    <div class="empty-state">请从左侧选择卡片</div>
  </main>

  <!-- 右：属性面板 -->
  <aside class="panel panel-right" data-od-id="layout-right">
    <div class="section-title">属性</div>
    <div id="property-panel">
      <div class="empty-state">选择图层查看属性</div>
    </div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-accent btn-sm" id="btn-save-layout">保存排版</button>
      <button class="btn btn-outline btn-sm" id="btn-reset-layout">重置</button>
    </div>
  </aside>
</div>

<script src="/canvas/js/template-renderer.js"></script>
<script src="/static/js/layout/layout-app.js"></script>
</body>
</html>
