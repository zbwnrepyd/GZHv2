<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aistartups.cn — 定稿台</title>
<link rel="icon" type="image/jpeg" href="/images/gzh-logo.jpg">
<link rel="apple-touch-icon" href="/images/gzh-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="/static/css/gzh2-base.css">
<link rel="stylesheet" href="/static/css/editor.css">
</head>
<body>
<header id="top-bar" class="top-bar">
  <a href="/"><img src="/images/gzh-logo.jpg" class="topbar-logo" alt="aistartups.cn"></a>
  <span class="page-label">定稿台</span>
  <span class="status-text" id="editor-company-label"></span>
  <span class="spacer"></span>
  <button id="btn-delete-company" class="btn-delete-company hidden" title="删除该公司全部数据">删除</button>
  <a class="top-link" href="/">研究台</a>
</header>

<main id="editor-workbench">
  <aside id="editor-left-pane">
    <!-- 1. 卡片设置（主流程入口，默认展开） -->
    <div class="accordion-section" data-od-id="editor-card-settings">
      <div class="accordion-header open" data-section="card-settings">
        <span class="arrow">&#9654;</span> 卡片设置
      </div>
      <div class="accordion-body open" data-section="card-settings" data-od-id="editor-card-settings-body">
        <div id="card-settings-content" data-od-id="editor-card-settings-content">
          <!-- 由 card-settings-panel.js 动态渲染 -->
        </div>
      </div>
    </div>

    <!-- 2. 文字定稿 -->
    <div class="accordion-section" data-od-id="editor-text-finalize">
      <div class="accordion-header" data-section="text-finalize">
        <span class="arrow">&#9654;</span> 文字定稿
      </div>
      <div class="accordion-body" data-section="text-finalize" data-od-id="editor-text-finalize-body">
        <div id="text-finalize-content" data-od-id="editor-text-finalize-content">
          <!-- 由 text-finalize-panel.js 动态渲染 -->
        </div>
      </div>
    </div>

    <!-- 3. 图片定稿 -->
    <div class="accordion-section">
      <div class="accordion-header" data-section="image">
        <span class="arrow">&#9654;</span> 图片定稿
      </div>
      <div class="accordion-body" data-section="image">
        <div id="image-slot-list">
          <!-- 槽位列表由 editor.js 动态渲染 -->
        </div>
        <div id="image-slot-actions">
          <button id="btn-recollect-editor" class="btn-recollect-editor">重新采集图片</button>
          <p class="recollect-hint-editor">研究完成后自动采集，点此手动重试。</p>
        </div>
      </div>
    </div>

    <!-- 4. 高级 / 兼容入口 -->
    <div class="accordion-section" data-od-id="editor-advanced">
      <div class="accordion-header" data-section="advanced">
        <span class="arrow">&#9654;</span> 高级 / 兼容入口
      </div>
      <div class="accordion-body" data-section="advanced">
        <button class="editor-card-btn" data-legacy="content">旧版内容定稿 (1-8 卡)</button>
        <button class="editor-card-btn" data-legacy="hook">传播钩子文案</button>
        <button class="editor-card-btn" data-legacy="dbfields">原始字段查看</button>
      </div>
    </div>

    <!-- 5. 进入排版 -->
    <div class="accordion-section" style="border-top:1px solid var(--border);padding-top:8px" data-od-id="editor-goto-layout">
      <a id="btn-go-layout" class="go-layout-link" href="#" data-od-id="editor-btn-go-layout">进入排版 →</a>
    </div>
  </aside>

  <!-- 内容定稿/钩子模式：中间栏+右侧栏 -->
  <section id="editor-middle-pane">
    <div class="markdown-toolbar">
      <span id="markdown-meta">请选择公司</span>
      <span id="dirty-indicator" class="dirty-indicator hidden">未定稿</span>
    </div>
    <div id="version-compare" class="version-compare">
      <div class="line-grid-header">
        <span data-version="standard">标准版</span>
        <span data-version="business">商业版</span>
        <span data-version="spread">传播版</span>
        <span>定稿输入</span>
      </div>
      <div id="line-choice-grid" class="line-choice-grid"></div>
    </div>
    <div class="markdown-footer">
      <button id="btn-prev" class="btn">← 上一张</button>
      <button id="btn-next" class="btn">下一张 →</button>
    </div>
    <!-- 钩子模式下的摘要区和钩子内容（与 version-compare 共享空间） -->
    <div id="hook-content" class="preview-content hidden"></div>
  </section>

  <section id="editor-right-pane">
    <div class="preview-toolbar">
      <span id="preview-status">只读预览</span>
    </div>
    <div class="preview-content" id="preview-render"></div>
    <div class="preview-actions">
      <button id="btn-confirm" class="btn btn-primary">确认定稿</button>
      <a id="btn-go-canvas" class="btn btn-accent hidden" href="#">去制作卡片 →</a>
    </div>
    <!-- 钩子模式下的预览（覆盖 preview-render） -->
    <div class="preview-content hidden" id="hook-render"></div>
  </section>

  <!-- 图片定稿模式：iframe 容器 -->
  <div id="image-studio-frame">
    <iframe id="image-studio-iframe" src="" title="图片定稿台"></iframe>
  </div>

  <!-- 钩子模式：占据中右区域 -->
  <div id="hook-mode">
    <div id="hook-mode-content" class="preview-content"></div>
  </div>

  <!-- 卡片设置模式：占据中右区域 -->
  <div id="card-settings-mode">
    <div id="card-settings-mode-content" class="preview-content"></div>
  </div>

  <!-- 文字定稿模式：占据中右区域 -->
  <div id="text-finalize-mode">
    <div id="text-finalize-mode-content" class="preview-content"></div>
  </div>

  <!-- 数据库字段模式：占据中右区域 -->
  <div id="db-fields-mode">
    <div class="db-fields-head">
      <span>数据库字段 · <span id="db-fields-company"></span></span>
      <label style="font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer">
        <input type="checkbox" id="db-show-system"> 显示系统字段
      </label>
    </div>
    <div id="db-fields-table-wrap">
      <table id="db-fields-table">
        <thead><tr>
          <th>字段</th><th>标准版</th><th>商业版</th><th>传播版</th>
        </tr></thead>
        <tbody id="db-fields-tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/confirm.js"></script>
<script src="/static/js/editor.js"></script>

<!-- GZHv2 新面板 -->
<script src="/static/js/editor/card-settings-panel.js"></script>
<script src="/static/js/editor/text-finalize-panel.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const company = new URLSearchParams(window.location.search).get('company') || '';
  if (!company) return;

  // 进入排版按钮
  const btnLayout = document.getElementById('btn-go-layout');
  if (btnLayout) btnLayout.href = `/layout?company=${encodeURIComponent(company)}`;

  // 监听手风琴切换，懒初始化新面板
  document.querySelectorAll('.accordion-header').forEach(h => {
    h.addEventListener('click', () => {
      const section = h.dataset.section;
      if (section === 'card-settings') CardSettingsPanel.init(company);
      if (section === 'text-finalize') TextFinalizePanel.init(company);
    });
  });

  // 高级/兼容入口：旧版按钮点击
  document.querySelectorAll('[data-legacy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const legacy = btn.dataset.legacy;
      if (legacy === 'content') EditorApp.switchSection('content');
      if (legacy === 'hook') { EditorApp.switchSection('hook'); EditorApp.showHooks(); }
      if (legacy === 'dbfields') EditorApp.switchSection('dbfields');
    });
  });
});
</script>
</body>
</html>
