<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片定稿台 — Image Studio v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/image-studio/css/studio.css">
</head>
<body>

<header class="top-bar" id="top-bar">
  <button class="back-btn">&#8592; 返回定稿台</button>
  <div class="company-name"></div>
</header>

<div class="main-layout">
  <!-- 左：槽位总览 -->
  <nav class="overview-panel">
    <h3>图片槽位</h3>
    <ul class="slot-list" id="slot-list"></ul>
  </nav>

  <!-- 中：预览/搜索切换 + 工具栏 -->
  <main class="editor-area" id="editor-area"></main>

  <!-- 右：候选缩略图 + 确定 -->
  <aside class="candidate-panel" id="candidate-panel"></aside>
</div>

<script src="/image-studio/js/studio-api.js"></script>
<script src="/image-studio/js/query-gen.js"></script>
<script src="/image-studio/js/search-panel.js"></script>
<script src="/image-studio/js/variant-sidebar.js"></script>
<script src="/image-studio/js/param-inspector.js"></script>
<script src="/image-studio/js/workspace-image.js"></script>
<script src="/image-studio/js/workspace-chart.js"></script>
<script src="/image-studio/js/studio-app.js"></script>
<script>
(function() {
  if (new URLSearchParams(window.location.search).get('embed') === '1') {
    document.getElementById('top-bar').classList.add('hidden');
    document.querySelector('.overview-panel').classList.add('hidden');
    document.querySelector('.main-layout').style.height = '100vh';
  }
})();
</script>

</body>
</html>
